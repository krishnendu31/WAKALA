<html lang="en"><head><meta charset="utf-8"><title>WAKALA — The Moment Before</title>

<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* WAKALA — THE MOMENT BEFORE. Original 2.5D motion graphics, drawn deterministically: window.draw(T) renders frame T (seconds).
   Conceptual scenes carry a "CONCEPTUAL VISUALIZATION" tag; the two proof scenes draw GENUINE prototype captures
   (../source60/capture) and carry "REAL PROTOTYPE — SYNTHETIC DATA". Nothing here imitates WAKALA's UI. */
const W = 1920, H = 1080;
const cv = document.getElementById("c"), X = cv.getContext("2d");
const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
const LA = mk(), LB = mk();
const COL = { navy: "#193E60", midnight: "#070F22", deep: "#0A1733", gold: "#D9B26B", goldDeep: "#B48A55", teal: "#2FB3A3", emerald: "#1E9C7E",
              blue: "#5AA9FF", pearl: "#F4F1EA", red: "#E5484D", amber: "#F2A33A", ink: "#1D3040" };
// ---------- utilities
let seed = 7;
const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sm = (x) => { x = cl(x); return x * x * (3 - 2 * x); };
const span = (T, a, b) => sm((T - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mixC = (h1, h2, k) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1); };
function txt(c, s, x, y, o = {}) {
  c.save(); c.font = `${o.w || 600} ${o.size || 28}px "Segoe UI", "Segoe UI Variable", Arial`; c.fillStyle = o.color || COL.pearl;
  c.textAlign = o.align || "left"; c.textBaseline = o.base || "alphabetic"; c.globalAlpha *= o.a ?? 1;
  if (o.ls) c.letterSpacing = o.ls + "px";
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = o.blur || 18; }

}
const bez = (P, p) => { const u = 1 - p; return [u*u*u*P[0][0] + 3*u*u*p*P[1][0] + 3*u*p*p*P[2][0] + p*p*p*P[3][0], u*u*u*P[0][1] + 3*u*u*p*P[1][1] + 3*u*p*p*P[2][1] + p*p*p*P[3][1]]; };
const tang = (P, p) => { const a = bez(P, Math.max(0, p - 0.002)), b = bez(P, Math.min(1, p + 0.002)); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
function strokeBez(c, P, from, to, color, width, glow, alpha = 1, dash) {
  c.save(); c.globalAlpha *= alpha; c.strokeStyle = color; c.lineWidth = width; c.lineCap = "round";
  if (glow) { c.shadowColor = color; c.shadowBlur = glow; }
  if (dash) c.setLineDash(dash);
  c.beginPath(); const n = 60;
  for (let i = 0; i <= n; i++) { const p = lerp(from, to, i / n); const q = bez(P, p); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }
  c.stroke(); c.restore();
}
function dot(c, x, y, r, color, glow = 20, a = 1) { c.save(); c.globalAlpha *= a; c.fillStyle = color; c.shadowColor = color; c.shadowBlur = glow; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.restore(); }
function pulses(c, P, T, speed, color, n = 3, r = 6, a = 1, upto = 1) {
  for (let k = 0; k < n; k++) { const p = ((T * speed + k / n) % 1) * upto; const q = bez(P, p); dot(c, q[0], q[1], r, color, 22, a * Math.sin(Math.PI * p / upto)); }
}
function vignette(c, k = 0.55) { const g = c.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.95); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${k})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }
const grain = (() => { const g = document.createElement("canvas"); g.width = g.height = 256; const gc = g.getContext("2d"); const im = gc.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; } gc.putImageData(im, 0, 0); return g; })();
function addGrain(c, T, a = 0.035) { c.save(); c.globalAlpha = a; c.globalCompositeOperation = "overlay"; const ox = (T * 997) % 256, oy = (T * 613) % 256;
  for (let x = -256; x < W + 256; x += 256) for (let y = -256; y < H + 256; y += 256) c.drawImage(grain, x - ox, y - oy); c.restore(); }
function tag(c, s, a = 1) { txt(c, s, 64, 78, { size: 17, w: 600, ls: 4, color: COL.pearl, a: 0.6 * a }); c.save(); c.globalAlpha = 0.6 * a; c.fillStyle = COL.gold; c.fillRect(64, 90, 46, 2); c.restore(); }

// ---------- assets: genuine prototype captures
const IMG = {};
let pending = 0;
for (const [k, f] of [["block", "../source60/capture/g05_blocked.png"], ["rec", "../source60/capture/g10_recovered.png"]]) {
  pending++; const im = new Image(); im.onload = () => { pending--; if (!pending) window.ready = true; }; im.src = f; IMG[k] = im;
}
const PXS = 4 / 3; // captures: 1440-wide CSS layout at 4/3 device scale

// ---------- CITY (procedural, UAE-inspired contemporary skyline; not a specific real skyline)
seed = 11;
const LAYERS = [0.28, 0.55, 1.0].map((par, li) => {
  const arr = []; let x = -900;
  while (x < 2900) {
    const w = (li === 2 ? 70 : li === 1 ? 52 : 40) + rnd() * (li === 2 ? 90 : 60);
    const h = (li === 2 ? 150 : li === 1 ? 120 : 80) + Math.pow(rnd(), 1.7) * (li === 2 ? 380 : li === 1 ? 300 : 210);
    const type = rnd(); arr.push({ x, w, h, type, s: rnd() * 1000 }); x += w + (li === 2 ? 26 : 14) + rnd() * 40;
  }
  if (li === 2) arr.push({ x: 1160, w: 70, h: 760, type: 0.97, s: 3 }); // one stepped supertall (generic), the city's anchor
  return { par, arr, li };
});
const ARCS = (() => { seed = 41; const a = []; const near = LAYERS[1].arr.filter((b) => b.h > 260);
  for (let i = 0; i < 9; i++) { const b1 = near[Math.floor(rnd() * near.length)], b2 = near[Math.floor(rnd() * near.length)]; if (Math.abs(b1.x - b2.x) > 260) a.push([b1, b2, rnd()]); } return a; })();

function cityFrame(c, T, mode) {

  const camX = mode === "end" ? 160 - 30 * T : -60 + 26 * T, camY = mode === "end" ? 0 : -14 * span(T, 0, 10) - 120 * span(T, 7, 10.4);

  c.fillStyle = g; c.fillRect(0, 0, W, H);

    g = c.createLinearGradient(x, 0, x + 900, 0); g.addColorStop(0, "rgba(255,220,180,0)"); g.addColorStop(0.5, `rgba(255,220,190,${0.05 + 0.02 * i})`); g.addColorStop(1, "rgba(255,220,180,0)");
    c.fillStyle = g; c.fillRect(x, y, 900, 26 + i * 6); }
  c.save(); c.translate(W / 2, hz); c.scale(z, z); c.translate(-W / 2, -hz + camY);
  // water
  g = c.createLinearGradient(0, hz, 0, H + 200); g.addColorStop(0, "#C99B6A"); g.addColorStop(0.08, "#4A4A62"); g.addColorStop(1, "#0A1530");
  c.fillStyle = g; c.fillRect(-400, hz, W + 800, 700);
  const tones = [["#5B5F7C", "#8A7C88"], ["#2C3A5C", "#4C5170"], ["#101C38", "#1E2A48"]];
  for (const L of LAYERS) {
    const off = -camX * L.par;
    for (const b of L.arr) {
      const x = b.x + off, top = hz - b.h;
      if (x > W + 300 || x + b.w < -300) continue;
      const [base, lit] = tones[L.li];
      const bg = c.createLinearGradient(x, 0, x + b.w, 0); bg.addColorStop(0, lit); bg.addColorStop(0.35, base); bg.addColorStop(1, base);
      c.fillStyle = bg; c.beginPath();
      if (b.type > 0.95) { // stepped supertall with spire
        const steps = 6; c.moveTo(x, hz);
        for (let s = 0; s < steps; s++) { const ww = b.w * (1 - s / steps) * 0.5, hh = top + (b.h * 0.86) * (1 - (s + 1) / steps); c.lineTo(x + b.w / 2 - ww, hh); c.lineTo(x + b.w / 2 - ww * 0.7, hh); }
        c.lineTo(x + b.w / 2 - 2, top - 120); c.lineTo(x + b.w / 2 + 2, top - 120);
        for (let s = steps - 1; s >= 0; s--) { const ww = b.w * (1 - s / steps) * 0.5, hh = top + (b.h * 0.86) * (1 - (s + 1) / steps); c.lineTo(x + b.w / 2 + ww * 0.7, hh); c.lineTo(x + b.w / 2 + ww, hh); }
        c.lineTo(x + b.w, hz);
      } else if (b.type > 0.78) { c.moveTo(x, hz); c.lineTo(x, top + 40); c.lineTo(x + b.w / 2, top - 30); c.lineTo(x + b.w, top + 40); c.lineTo(x + b.w, hz); }
      else if (b.type > 0.6) { c.moveTo(x, hz); c.lineTo(x, top); c.quadraticCurveTo(x + b.w * 0.5, top - 50, x + b.w, top + 10); c.lineTo(x + b.w, hz); }

// ---------- NETWORK WORLD (abstract, the citizen's request)
const NODE = { M: [330, 560], R: [760, 300], I: [820, 590], P: [760, 860], IR: [1400, 470], RS: [1330, 190], TR: [1330, 930], OR: [1660, 840], I2: [930, 735] };
const PATH = {
  MI: [NODE.M, [520, 560], [640, 590], NODE.I], MR: [NODE.M, [500, 470], [600, 300], NODE.R], MP: [NODE.M, [500, 660], [600, 860], NODE.P],
  IIR: [NODE.I, [1020, 590], [1200, 470], NODE.IR], RRS: [NODE.R, [1000, 300], [1150, 190], NODE.RS], PTR: [NODE.P, [1000, 860], [1150, 930], NODE.TR],
  IOR: [NODE.I, [1040, 640], [1350, 840], NODE.OR], MI2: [NODE.M, [540, 640], [720, 735], NODE.I2], I2IR: [NODE.I2, [1150, 735], [1230, 470], NODE.IR],
};
seed = 99;
const BG = Array.from({ length: 7 }, (_, i) => { const y0 = 80 + rnd() * 920, y1 = 80 + rnd() * 920; return { P: [[-200, y0], [500, y0 + (rnd() - 0.5) * 300], [1400, y1 + (rnd() - 0.5) * 300], [2150, y1]], d: 0.35 + rnd() * 0.5, sp: 0.06 + rnd() * 0.08, c: rnd() > 0.5 ? COL.blue : COL.emerald }; });
const DUST = Array.from({ length: 220 }, () => ({ x: rnd() * 2400 - 240, y: rnd() * 1300 - 110, z: 0.2 + rnd() * 0.9, r: 0.6 + rnd() * 2.2, ph: rnd() * 6 }));
const BRANCH_STOP = 0.93; // where the authorization boundary sits on the I→OR branch

function agentNode(c, [x, y], label, o = {}) {
  const col = o.col || COL.teal, a = o.a ?? 1, s = o.s ?? 1;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.scale(s, s);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 90); g.addColorStop(0, hexA(col, 0.35)); g.addColorStop(1, hexA(col, 0)); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 90, 0, 7); c.fill();
  c.strokeStyle = col; c.lineWidth = 3; c.shadowColor = col; c.shadowBlur = 18; c.beginPath();
  for (let i = 0; i < 6; i++) { const an = Math.PI / 6 + i * Math.PI / 3; i ? c.lineTo(38 * Math.cos(an), 38 * Math.sin(an)) : c.moveTo(38 * Math.cos(an), 38 * Math.sin(an)); } c.closePath(); c.stroke();

  c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fillStyle = "#EAFBF7"; c.fill();
  const ob = (o.T || 0) * 1.6; c.beginPath(); c.arc(54 * Math.cos(ob), 54 * Math.sin(ob) * 0.45, 3.5, 0, 7); c.fillStyle = col; c.fill();
  c.restore();
  if (label) txt(c, label, x, y + (o.above ? -70 : 76) * s, { size: o.above ? 19 : 17, w: 700, ls: 3, align: "center", color: o.lc || "#CFE3F2", a: a * (o.la ?? 0.85) });
}
function recordNode(c, [x, y], title, sub, o = {}) {
  const col = o.col || COL.pearl, a = o.a ?? 1;
  c.save(); c.globalAlpha *= a; c.translate(x, y);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 120); g.addColorStop(0, hexA(o.glowc || "#CFE6FF", 0.30)); g.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 120, 0, 7); c.fill();
  c.rotate(Math.PI / 4); c.strokeStyle = col; c.lineWidth = 2.5; c.shadowColor = o.glowc || "#CFE6FF"; c.shadowBlur = 22;
  c.strokeRect(-34, -34, 68, 68); c.globalAlpha *= 0.5; c.strokeRect(-22, -22, 44, 44); c.restore();
  if (o.lock) { c.save(); c.globalAlpha *= a; c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.arc(x, y - 6, 9, Math.PI, 0); c.stroke(); c.fillStyle = col; c.fillRect(x - 12, y - 6, 24, 18); c.restore(); }
  if (title) txt(c, title, x, y + 82, { size: 17, w: 700, ls: 3, align: "center", color: "#E9F1FA", a: a * 0.9 });
  if (sub) txt(c, sub, x, y + 106, { size: 15, w: 500, ls: 1, align: "center", color: "#9FB6CC", a: a * 0.8 });
}
function citizen(c, [x, y], a, T) {
  c.save(); c.globalAlpha *= a;
  const g = c.createRadialGradient(x, y, 0, x, y, 170); g.addColorStop(0, "rgba(244,241,234,0.30)"); g.addColorStop(1, "rgba(244,241,234,0)"); c.fillStyle = g; c.beginPath(); c.arc(x, y, 170, 0, 7); c.fill();
  c.translate(x, y); c.fillStyle = "rgba(244,241,234,0.10)"; c.strokeStyle = "rgba(244,241,234,0.85)"; c.lineWidth = 2; c.shadowColor = "#F4F1EA"; c.shadowBlur = 24;
  c.beginPath(); c.roundRect(-110, -46, 220, 92, 46); c.fill(); c.stroke();
  c.shadowBlur = 0; c.fillStyle = COL.pearl; c.beginPath(); c.arc(-62, -10, 13, 0, 7); c.fill(); c.beginPath(); c.ellipse(-62, 22, 22, 13, 0, Math.PI, 0); c.fill();
  c.restore();

  txt(c, "residency renewal", x - 28, y + 22, { size: 15, w: 500, color: "#C9D6E4", a: a * 0.9 });
}
function netBackground(c, T, td, cam, dim = 0) {
  const g = c.createRadialGradient(W * 0.55, H * 0.45, 0, W * 0.55, H * 0.45, W * 0.75);
  g.addColorStop(0, mixC("#13284F", "#0A1530", dim)); g.addColorStop(1, mixC("#050A18", "#03060E", dim)); c.fillStyle = g; c.fillRect(0, 0, W, H);

  for (let k = 0; k < 9; k++) { const yy = vy + Math.pow((k + ((T * 0.12 * td) % 1)) / 9, 2.2) * (H - vy + 40); c.beginPath(); c.moveTo(0, yy); c.lineTo(W, yy); c.stroke(); }
  c.restore();

}
function boundary(c, P, T, build, state, flash) {
  // the authorization boundary: a geometric plane, perpendicular to the request, assembled from interlocking hexagons
  const q = bez(P, BRANCH_STOP), th = tang(P, BRANCH_STOP);
  c.save(); c.translate(q[0], q[1]); c.rotate(th);
  const ry = 230 * sm(build), rx = 46;
  const halo = c.createRadialGradient(0, 0, 0, 0, 0, 300); halo.addColorStop(0, hexA(state === "red" ? COL.red : COL.teal, 0.20 * build)); halo.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = halo; c.fillRect(-300, -300, 600, 600);
  c.beginPath(); c.ellipse(0, 0, rx, Math.max(1, ry), 0, 0, 7); c.save(); c.clip();
  c.strokeStyle = hexA(COL.gold, 0.55); c.lineWidth = 1.6; const sh = (T * 6) % 34;

    c.globalAlpha = k; c.beginPath(); for (let i = 0; i < 6; i++) { const an = i * Math.PI / 3; const px = xx + ((yy / 30) % 2 ? 17 : 0) + 12 * Math.cos(an) * 0.45, py = yy + sh + 12 * Math.sin(an); i ? c.lineTo(px, py) : c.moveTo(px, py); } c.closePath(); c.stroke();
  }
  c.restore(); c.globalAlpha = 1;
  const rim = state === "red" ? COL.red : COL.gold;

// ---------- timeline compositor
const SCENES = [
  { a: 0.0, b: 10.4, fi: 0, fo: 1.2, f: (c, T) => cityFrame(c, T, "start") },
  { a: 9.2, b: 32.4, fi: 1.2, fo: 0.8, f: netFrame },
  { a: 31.6, b: 40.6, fi: 0.8, fo: 0.6, f: proofFrame },
  { a: 40.0, b: 49.6, fi: 0.6, fo: 0.7, f: recoverFrame },
  { a: 48.9, b: 55.4, fi: 0.7, fo: 0.8, f: proof2Frame },
  { a: 54.6, b: 58.0, fi: 0.8, fo: 1.0, f: (c, T) => { cityFrame(c, T - 54.6, "end"); tag(c, "CONCEPTUAL VISUALIZATION"); } },
  { a: 57.0, b: 60.5, fi: 1.0, fo: 0, f: logoFrame },
];
window.draw = (T) => {
  X.globalAlpha = 1; X.fillStyle = "#000"; X.fillRect(0, 0, W, H);
  let first = true;
  for (const s of SCENES) {
    if (T < s.a || T >= s.b) continue;
    const ain = s.fi ? cl((T - s.a) / s.fi) : 1, aout = s.fo ? cl((s.b - T) / s.fo) : 1, a = sm(Math.min(ain, aout));
    const L = first ? LA : LB, lc = L.getContext("2d");
    lc.save(); lc.globalAlpha = 1; lc.setTransform(1, 0, 0, 1, 0, 0); lc.clearRect(0, 0, W, H); s.f(lc, T); lc.restore();
    X.save(); X.globalAlpha = first ? a : a; X.drawImage(L, 0, 0); X.restore();
    first = false;
  }
  if (T < 0.6) { X.save(); X.globalAlpha = 1 - T / 0.6; X.fillStyle = "#000"; X.fillRect(0, 0, W, H); X.restore(); }
  addGrain(X, T, 0.025);
};
