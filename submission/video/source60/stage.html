<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>stage</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F7F6F2; font-family: "Segoe UI", Inter, Arial, sans-serif; color: #1D3040; }
  /* app window: real screenshot crop, never covered by captions or subtitles */
  .win { position: absolute; left: 240px; top: 28px; width: 1440px; height: 810px; border-radius: 14px; overflow: hidden;
         background: #fff; border: 1px solid #E0E4E3; box-shadow: 0 2px 4px #1d30400f, 0 22px 48px -24px #1d304055; }
  .win img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .focus { position: absolute; border: 4px solid #0E4D48; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(29,48,64,0.16); }
  .focus.deny { border-color: #B42318; } .focus.warn { border-color: #A85A06; } .focus.navy { border-color: #193E60; }
  .band { position: absolute; left: 240px; width: 1440px; top: 860px; height: 76px; display: flex; align-items: center; gap: 18px; }
  .chip { flex: none; padding: 8px 16px; border-radius: 999px; background: #0E4D48; color: #fff; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  .chip.deny { background: #B42318; } .chip.navy { background: #193E60; } .chip.gold { background: #8A6534; }
  .head { font-size: 33px; font-weight: 600; color: #193E60; line-height: 1.15; }
  .head.deny { color: #B42318; }
  .src { margin-left: auto; flex: none; font-size: 17px; color: #687783; text-align: right; line-height: 1.3; }
  /* full-frame cards (title, evidence, closing) */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand .name { font-size: 96px; font-weight: 700; letter-spacing: .08em; color: #193E60; }
  .brand .ar { font-size: 78px; color: #B48A55; font-weight: 600; }
  .tag { margin-top: 18px; font-size: 40px; font-weight: 600; color: #0E4D48; }
  .eyebrow { font-size: 22px; letter-spacing: .22em; text-transform: uppercase; color: #687783; font-weight: 600; }
  .q { margin-top: 64px; max-width: 1300px; font-size: 50px; line-height: 1.22; font-weight: 600; color: #1D3040; }
  .rule { width: 120px; height: 4px; background: #B48A55; border-radius: 4px; margin: 40px auto 0; }
  .three { margin-top: 56px; display: flex; gap: 28px; }
  .three div { padding: 22px 34px; border-radius: 16px; background: #fff; border: 1px solid #E0E4E3; font-size: 36px; font-weight: 600; color: #193E60; box-shadow: 0 10px 30px -18px #1d304040; }
  .three div span { color: #0E4D48; }
  .fine { position: absolute; bottom: 150px; left: 0; right: 0; text-align: center; font-size: 22px; color: #687783; }
  .ev { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 420px); gap: 26px; }
  .tile { background: #fff; border: 1px solid #E0E4E3; border-radius: 18px; padding: 28px 30px; text-align: left; box-shadow: 0 10px 30px -18px #1d304040; }
  .tile b { display: block; font-size: 60px; color: #0E4D48; line-height: 1.05; }
  .tile b.navy { color: #193E60; }
  .tile span { display: block; margin-top: 10px; font-size: 24px; color: #1D3040; line-height: 1.3; }
  .tile small { display: block; margin-top: 8px; font-size: 18px; color: #687783; }
  .badge { display: inline-block; margin-top: 18px; padding: 8px 18px; border-radius: 999px; border: 1px solid #b48a5566; background: #b48a551c; color: #8A6534; font-size: 20px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
</style></head>
<body>
<script>
// Stage config arrives as base64 JSON in the URL hash (rendered by render_stages.js).
const c = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
const logo = `<svg viewBox="0 0 32 32" width="${c.logo || 110}" height="${c.logo || 110}"><rect width="32" height="32" rx="9" fill="#0e4d48"/><path d="M16 6 8 9.2v5.9c0 4.8 3.4 8.6 8 9.9 4.6-1.3 8-5.1 8-9.9V9.2L16 6Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="m12.2 15.4 2.7 2.7 5-5.4" fill="none" stroke="#d9b77e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let h = "";
if (c.kind === "app") {
  // crop: CSS-px rectangle of the captured page; the screenshot is (css.w * scale) pixels wide
  const s = 1440 / c.crop.w;
  h += `<div class="win"><img src="${c.img}" style="width:${c.css.w * s}px;transform:translate(${-c.crop.x * s}px,${-c.crop.y * s}px)">`;
  (c.focus || []).forEach((f, i) => {
    const p = f.pad ?? 10;
    h += `<div class="focus ${f.tone || ""}" style="${i ? "box-shadow:none;" : ""}left:${(f.x - c.crop.x - p) * s}px;top:${(f.y - c.crop.y - p) * s}px;width:${(f.w + 2 * p) * s}px;height:${(f.h + 2 * p) * s}px"></div>`;
  });
  h += `</div><div class="band"><span class="chip ${c.tone || ""}">${c.chip}</span><span class="head ${c.headTone || ""}">${c.head}</span>
        <span class="src">Real prototype capture<br>fictional citizens · synthetic data</span></div>`;
} else if (c.kind === "title" && c.big) {
  h += `<div class="card"><div class="brand">${logo}<span class="name">WAKALA</span><span class="ar">وكالة</span></div>
        <p class="tag">Autonomous AI. Accountable Actions.</p><div class="rule"></div>
        <p class="q" style="font-size:66px;letter-spacing:.04em;color:#193E60;margin-top:54px">${c.big}</p></div>`;
} else if (c.kind === "title") {
  h += `<div class="card"><p class="eyebrow">UAE Hackathon 2026 · Challenge #27 · Secure Agentic AI for Government Services</p>
        <div class="brand" style="margin-top:48px">${logo}<span class="name">WAKALA</span><span class="ar">وكالة</span></div>
        <p class="tag">Autonomous AI. Accountable Actions.</p><div class="rule"></div><p class="q">${c.head}</p></div>`;
} else if (c.kind === "evidence") {
  h += `<div class="card"><p class="eyebrow">Measured evidence</p><p class="q" style="margin-top:20px;font-size:46px">${c.head}</p>
        <span class="badge">Synthetic prototype benchmark · not government statistics</span><div class="ev">${c.tiles.map((t) =>
        `<div class="tile"><b class="${t.tone || ""}">${t.big}</b><span>${t.text}</span><small>${t.small || ""}</small></div>`).join("")}</div>
        <p style="margin-top:34px;font-size:20px;color:#687783">Source: ${c.source}</p></div>`;
} else if (c.kind === "closing" && c.lines) {
  h += `<div class="card"><div class="brand">${logo}<span class="name">WAKALA</span><span class="ar">وكالة</span></div>
        <div class="three">${c.lines.map((l) => `<div>${l}</div>`).join("")}</div>
        <p class="tag" style="margin-top:56px">WAKALA — Autonomous AI. Accountable Actions.</p>
        <p class="fine">${c.fine}</p></div>`;
} else if (c.kind === "closing") {
  h += `<div class="card"><div class="brand">${logo}<span class="name">WAKALA</span><span class="ar">وكالة</span></div>
        <div class="three"><div>Verify <span>authority</span>.</div><div>Stop <span>unauthorized</span> actions.</div><div>Keep services <span>moving</span>.</div></div>
        <p class="tag" style="margin-top:60px">WAKALA — Autonomous AI. Accountable Actions.</p>
        <p class="fine">Fictional government service prototype · Synthetic data · Offline deterministic agent workflow</p></div>`;
}
document.body.innerHTML = h;
document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = r; i.onerror = r; }))))
  .then(() => { document.body.dataset.ready = "1"; });
</script>
</body></html>
